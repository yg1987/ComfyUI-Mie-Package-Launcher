name: Build Windows release package

on:
  workflow_dispatch:
  push:
    branches:
      - my-changes

permissions:
  contents: write

jobs:
  build:
    name: Build formal Windows release
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka
          # GitHub-hosted runners are currently blocked by the vendor host.  Use
          # the signed upstream installer cached in this repository's prerelease,
          # then verify its Authenticode signature before every installation.
          $installerDir = Join-Path $env:SystemDrive 'enigma-installers'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          $installed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
            $installer = Join-Path $installerDir "enigmavb-$env:GITHUB_RUN_ID-$attempt.exe"
            try {
              gh release download enigma-v11.30-build20250428 `
                --repo $env:GITHUB_REPOSITORY --pattern 'enigmavb-probe.bin' `
                --dir $installerDir --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Could not download the cached Enigma installer (exit code $LASTEXITCODE)."
              }
              Move-Item -LiteralPath (Join-Path $installerDir 'enigmavb-probe.bin') `
                -Destination $installer -Force
              if ((Get-Item -LiteralPath $installer).Length -lt 1MB) {
                throw 'The downloaded Enigma Virtual Box installer is unexpectedly small.'
              }
              $signature = Get-AuthenticodeSignature -FilePath $installer
              if ($signature.Status -ne 'Valid') {
                throw "The Enigma installer signature is not valid: $($signature.Status)."
              }
              Write-Host "Enigma installer attempt $attempt SHA-256: $((Get-FileHash -Path $installer -Algorithm SHA256).Hash)"
              Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -NoNewWindow -ErrorAction Stop
              $installed = Test-Path 'C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe'
            }
            catch {
              Write-Warning "Enigma installer attempt $attempt failed: $($_.Exception.Message)"
            }
          }
          if (-not $installed) {
            throw 'Enigma Virtual Box could not be installed after three fresh download attempts.'
          }
          if (-not (Test-Path 'C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe')) {
            throw 'Enigma Virtual Box console was not installed to the expected location.'
          }

      - name: Map the existing Enigma project path
        shell: pwsh
        run: |
          $workspaceParent = Split-Path -Parent $env:GITHUB_WORKSPACE
          subst F: $workspaceParent
          if (-not (Test-Path 'F:\ComfyUI-Mie-Package-Launcher\EnigmaVirtualBox\launcher.evb')) {
            throw 'The Enigma project path was not mapped as expected.'
          }

      - name: Build formal release
        shell: pwsh
        run: |
          python -X utf8 build.py --release
          $release = @(Get-ChildItem -Path release -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($release.Count -ne 1) {
            throw "Expected exactly one standalone EXE in release/, found $($release.Count)."
          }

      - name: Upload formal release artifact
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-launcher-release-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ((Get-Content -Raw build_parameters.json | ConvertFrom-Json).version).TrimStart('v', 'V')
          $tag = "v$version"
          $release = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($release.Count -ne 1) {
            throw "Expected exactly one standalone EXE to publish, found $($release.Count)."
          }
          gh release create $tag $release.FullName --target $env:GITHUB_SHA --title "ComfyUI启动器 v$version" --generate-notes
