name: Build plugin-management test package

on:
  workflow_dispatch:
  push:
    branches:
      - my-changes

permissions:
  contents: read

jobs:
  build:
    name: Build Windows standalone package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka

      - name: Build test-channel standalone package
        shell: pwsh
        run: |
          python build_exe_v2.py --test
          if (-not (Test-Path "dist\ComfyUI启动器_test.dist\ComfyUI_Launcher_Internal.exe")) {
            throw "Nuitka output executable was not created."
          }

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-launcher-plugin-management-test-${{ github.sha }}
          path: dist/ComfyUI启动器_test.dist
          if-no-files-found: error
          retention-days: 14
